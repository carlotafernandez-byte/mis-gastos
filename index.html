<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050b18">
<meta name="apple-mobile-web-app-title" content="Mis Gastos">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="referrer" content="no-referrer">
<!-- Sin rastreo: la app no carga nada de fuera (ni fuentes, ni analítica) -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; form-action 'none'">
<title>Mis Gastos</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="top">
  <div class="top-row">
    <div class="brand">
      <div class="brand-logo">€</div>
      <div><h1 id="greeting">Mis Gastos</h1><div class="sub" id="month-label"></div></div>
    </div>
    <span class="live-badge"><i></i>EN VIVO</span>
  </div>
  <div class="ticker" aria-hidden="true"><div class="ticker-track" id="ticker"></div></div>
</header>

<main>
  <section id="view-home" class="view active"></section>
  <section id="view-list" class="view"></section>
  <section id="view-save" class="view"></section>
  <section id="view-deals" class="view"></section>
  <section id="view-settings" class="view"></section>
</main>

<button id="fab" class="fab" aria-label="Añadir gasto">+</button>

<nav class="tabs">
  <button data-view="home" class="active"><svg viewBox="0 0 24 24"><path d="M3 17l5-5 4 4 8-9"/><path d="M15 7h5v5"/></svg>Mercado</button>
  <button data-view="list"><svg viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>Gastos</button>
  <button data-view="save"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/></svg>Objetivo</button>
  <button data-view="deals"><svg viewBox="0 0 24 24"><path d="M3 12V4h8l10 10-8 8z"/><circle cx="7.5" cy="8.5" r="1.5"/></svg>Ofertas</button>
  <button data-view="settings"><svg viewBox="0 0 24 24"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>Ajustes</button>
</nav>

<!-- Hoja para añadir movimiento (también se usa en modo obligatorio) -->
<dialog id="add-dialog" class="sheet">
  <div class="grab"></div>
  <form id="add-form" method="dialog" autocomplete="off">
    <div id="forced-banner" class="forced-banner" hidden></div>
    <div class="seg" id="type-seg">
      <label><input type="radio" name="type" value="gasto" checked><span>Gasto</span></label>
      <label><input type="radio" name="type" value="ingreso"><span>Ingreso</span></label>
    </div>
    <input id="add-amount" name="amount" class="big-input" type="text" inputmode="decimal" placeholder="0,00 €" required>
    <input name="merchant" type="text" placeholder="¿Dónde? (Zara, Mercadona…)" list="merchants">
    <datalist id="merchants"></datalist>
    <div class="muted" id="cat-hint" style="margin-top:6px">Categoría</div>
    <div id="cat-grid" class="cat-grid"></div>
    <div class="row">
      <input name="date" type="date" required>
      <input name="note" type="text" placeholder="Nota (opcional)">
    </div>
    <div class="row" style="margin-top:6px">
      <button type="button" class="btn ghost" id="add-cancel">Cancelar</button>
      <button type="submit" class="btn primary" value="ok">Guardar</button>
    </div>
    <div style="text-align:center"><button type="button" class="linkbtn" id="add-not-expense" hidden>No era un pago mío / ya lo apunté</button></div>
  </form>
</dialog>

<!-- Pop-up de alerta / confirmaciones -->
<dialog id="alert-dialog" class="modal">
  <div class="alert-ring" id="alert-ring"></div>
  <h2 id="alert-title"></h2>
  <p id="alert-body"></p>
  <div id="alert-actions"></div>
</dialog>

<!-- Asistente inicial -->
<div id="onboarding" class="onb" hidden>
  <div class="onb-progress" id="onb-progress"></div>
  <div class="onb-body" id="onb-body"></div>
  <div class="onb-actions">
    <button class="btn ghost" id="onb-back">Atrás</button>
    <button class="btn primary" id="onb-next">Continuar</button>
  </div>
</div>

<div id="toast" class="toast"></div>

<script src="data.js"></script>
<script src="icons.js"></script>
<script src="charts.js"></script>
<script src="app.js"></script>
</body>
</html>
